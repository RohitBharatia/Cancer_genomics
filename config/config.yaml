samples:
  - normal
  - tumor

data_dir: "data/var_calling"
QC: "results/quality_control"
TRIMMED: "results/quality_control/fastp"        # fastp output (used by alignment)
ALIGN: "results/alignments"
BWA_IDX: "data/var_calling/bwa_idx/genome.fa"   # bwa-mem2 index prefix


# Variant calling
VARIANTS: "results/variants"

var_calling:
  tumor_bam:   "data/var_calling/alignments/tumor.recal.bam"
  tumor_bai:   "data/var_calling/alignments/tumor.recal.bai"
  normal_bam:  "data/var_calling/alignments/normal.recal.bam"
  normal_bai:  "data/var_calling/alignments/normal.recal.bai"
  normal_name: "normal"        
  ref:         "data/var_calling/reference/ref_genome.fa"         
  intervals:   "data/var_calling/reference/exome_regions.bed.interval_list"
  germline:    "data/var_calling/resources/af-only-gnomad.hg38.subset.vcf.gz"
  pon:         "data/var_calling/resources/1000g_pon.hg38.subset.vcf.gz"