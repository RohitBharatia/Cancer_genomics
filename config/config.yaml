samples:
  - normal
  - tumor

data_dir: "data"
quality_control: "results/quality_control"
trimmed: "results/quality_control/fastp"               # fastp output (used by alignment)
calibration: "results/quality_calibration"
align: "results/alignments"
reference: "data/var_calling/bwa_idx/genome.fa"   # bwa-mem2 index prefix
known_sites: "data/var_calling/dbsnp/GCF_000001405.40_alias.vcf.gz"
known_indels: "data/var_calling/known_indels/resources_broad_hg38_v0_Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"


# Variant calling
VARIANTS: "results/variants"

VAR_CALLING:
  tumor_bam:   "data/var_calling/alignments/tumor.recal.bam"
  tumor_bai:   "data/var_calling/alignments/tumor.recal.bai"
  normal_bam:  "data/var_calling/alignments/normal.recal.bam"
  normal_bai:  "data/var_calling/alignments/normal.recal.bai"
  normal_name: "normal"        
  ref:         "data/var_calling/reference/ref_genome.fa"         
  intervals:   "data/var_calling/reference/exome_regions.bed.interval_list"
  germline:    "data/var_calling/resources/af-only-gnomad.hg38.subset.vcf.gz"
  pon:         "data/var_calling/resources/1000g_pon.hg38.subset.vcf.gz"

# annotation (VEP)
annotation: "results/annotation"
clinvar: "data/var_calling/resources/clinvar/clinvar.vcf.gz"
vep_cache: "/data/courses/cancergenomics/2026/VEP/vep_data"
vep_cache_version: 116
